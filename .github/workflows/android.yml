name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble, unit test, and lint both flavors
        run: ./gradlew assembleCleanDebug assembleDefectsDebug testCleanDebugUnitTest testDefectsDebugUnitTest lintCleanDebug lintDefectsDebug
