name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; (yes || true) | "$SDKMANAGER" --licenses >/dev/null; "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Assemble, unit test, and lint clean flavor
        run: ./gradlew assembleCleanDebug assembleDefectsDebug testCleanDebugUnitTest testDefectsDebugUnitTest lintCleanDebug
      - name: Lint defects flavor (intentional findings, report only)
        run: ./gradlew --continue lintDefectsDebug || true
